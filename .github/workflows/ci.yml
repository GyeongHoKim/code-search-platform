# Continuous integration.
#
# This file is plain GitHub Actions syntax and runs unmodified on Gitea Actions,
# which is what companies mirroring this into an internal Gitea will use. Two
# caveats for that case, both about the runner rather than this file:
#
#   - some Gitea runner images cannot resolve actions/checkout. Replace that
#     step with a `git clone` of ${{ gitea.repository }} if so.
#   - the runner needs network access to fetch the actions and the toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise refuses to read a config it has not been told to trust, and there is
  # no interactive prompt on a runner.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  quality:
    name: Lint and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      # Exactly what `just ci` runs locally, so the two cannot drift.
      - run: just ci

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: just test-race

      - run: just build

      # `clean` is the one recipe with separate [unix] and [windows] bodies.
      # Running it here is how we find out the Windows branch still works.
      - run: just clean

  docs:
    name: Vendored docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      # docs/zoekt is generated. If someone edited it by hand, or bumped the
      # pinned revision without refetching, the two disagree and this catches
      # it before the reference silently stops describing the pinned Zoekt.
      - run: just docs-fetch

      - run: git diff --exit-code docs/zoekt

  chart:
    name: Helm chart renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - run: helm lint deploy/helm

      # A chart that lints but does not render is a chart nobody can install.
      - run: helm template zoekt-mcp-server deploy/helm -f deploy/helm/values-example-gerrit.yaml

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Conventional Commits with a required scope. This is a shell step rather
      # than commitlint because commitlint would drag Node into a repository
      # that otherwise needs only Go.
      - name: Check subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9-]+\)!?: .+'
          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject="$(git log -1 --format=%s "$sha")"
            # Merge commits are generated by the forge, not written by a person.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::not a conventional commit with a scope: $subject"
              failed=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::subject longer than 72 characters: $subject"
              failed=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          exit "$failed"
