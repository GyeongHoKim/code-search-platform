{{- $full := include "zoekt-mcp-server.fullname" . -}}
{{- if not (or .Values.mcp.auth.existingSecret .Values.mcp.auth.create) -}}
{{- fail "mcp.auth: set mcp.auth.existingSecret, or mcp.auth.create with mcp.auth.token. Zoekt has no authentication of its own and this server is the only front door to it, so an unauthenticated deployment exposes every repository you indexed." -}}
{{- end -}}
{{- if and .Values.mcp.auth.create (not .Values.mcp.auth.existingSecret) }}
{{- if not .Values.mcp.auth.token -}}
{{- fail "mcp.auth.create is set but mcp.auth.token is empty. Generate one with: openssl rand -base64 32" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-auth
  labels:
    {{- include "zoekt-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  # Comma separated, so a token can be rotated without a window in which every
  # caller is broken.
  token: {{ .Values.mcp.auth.token | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-mcp
  labels:
    {{- include "zoekt-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zoekt-mcp-server.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "zoekt-mcp-server.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          env:
            # The only address of Zoekt anyone needs. It is a ClusterIP name,
            # so this is also the reason the engine never needs an Ingress.
            - name: ZOEKT_MCP_UPSTREAM_URL
              value: "http://{{ $full }}-zoekt:{{ .Values.zoekt.service.port }}"
            - name: ZOEKT_MCP_TRANSPORT
              value: http
            - name: ZOEKT_MCP_ADDR
              value: "0.0.0.0:{{ .Values.mcp.service.targetPort }}"
            - name: ZOEKT_MCP_CONTEXT_LINES
              value: {{ .Values.mcp.contextLines | quote }}
            - name: ZOEKT_MCP_MAX_RESULTS
              value: {{ .Values.mcp.maxResults | quote }}
            - name: ZOEKT_MCP_TIMEOUT
              value: {{ .Values.mcp.timeout | quote }}
            # The server refuses to start on the http transport without this,
            # which is the point: there is no configuration of this chart that
            # quietly serves the corpus to anyone who can reach the Ingress.
            - name: ZOEKT_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "zoekt-mcp-server.authSecret" . }}
                  key: token
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-mcp
  labels:
    {{- include "zoekt-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "zoekt-mcp-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp
