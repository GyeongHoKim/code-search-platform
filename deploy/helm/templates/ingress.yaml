{{/*
The MCP server is the only component that is ever exposed. Zoekt has no
authentication of its own, so putting an Ingress in front of it would publish
every indexed repository to anyone who can reach the host.
*/}}
{{- if .Values.ingress.enabled }}
{{- $full := include "code-search-platform.fullname" . -}}
{{- if eq .Values.ingress.kind "traefik-ingressroute" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $full }}-mcp
  labels:
    {{- include "code-search-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`{{ .Values.ingress.path }}`)
      services:
        - name: {{ $full }}-mcp
          port: {{ .Values.mcp.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- with .Values.ingress.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-mcp
  labels:
    {{- include "code-search-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $full }}-mcp
                port:
                  number: {{ .Values.mcp.service.port }}
{{- end }}
{{- end }}
